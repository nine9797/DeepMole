name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORG_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(11) } else { "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download zapret bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Flowseal/zapret-discord-youtube --pattern "*.zip" --dir zapret-dl
          $zip = Get-ChildItem zapret-dl -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath zapret-src
          $bin = Get-ChildItem zapret-src -Recurse -Filter winws.exe | Select-Object -First 1
          "ZAPRET_DIR=$($bin.Directory.Parent.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload unsigned executables
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe-${{ steps.ver.outputs.version }}
          path: |
            dist/deepmole.exe
            dist/deepmole-cli.exe

      - name: Sign executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe

      - name: Use signed executables
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-exe\*.exe dist\ -Force

      - name: Pack
        shell: pwsh
        run: .\release.ps1 -Version ${{ steps.ver.outputs.version }} -ZapretDir $env:ZAPRET_DIR -SkipBuild

      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-${{ steps.ver.outputs.version }}
          path: dist/*-setup.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use signed installer and refresh checksums
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-setup\*-setup.exe dist\ -Force
          $v = "${{ steps.ver.outputs.version }}"
          $sums = Get-ChildItem dist -File | Where-Object { $_.Name -like "DeepMole-$v-*" } |
              ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("dist\SHA256SUMS", (($sums -join "`n") + "`n"))

      - uses: actions/upload-artifact@v4
        with:
          name: DeepMole-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
